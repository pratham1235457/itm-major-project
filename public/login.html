<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in • Prompt Injection Detector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container login-container">
    <header>
      <p class="eyebrow">PROMPT INJECTION DETECTOR</p>
      <h1>Welcome back</h1>
      <p class="subtitle">Log in with your user ID or email to continue.</p>
    </header>
    <section class="panel">
      <form id="loginForm">
        <label for="identifier">User ID or email</label>
        <input id="identifier" name="identifier" type="text" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button id="loginBtn" type="submit">Log in</button>
        <p id="error" class="error" role="alert" aria-live="polite"></p>
      </form>
    </section>
    <footer>Prompt Injection Detector • Rule-based detection • Not a production security boundary<br />@2026</footer>
  </main>
  <script src="login.js"></script>
</body>
</html>
